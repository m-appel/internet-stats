[project]
name = "internet-stats"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "msgpack>=1.2.4",
    "py-radix>=1.1.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.92",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = ["LOG015", "C408"]
